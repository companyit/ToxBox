# 仅供负责人审阅的 Nginx 静态站点示例；未读取或修改线上配置。
# 需替换实际发布目录及证书路径，在独立部署授权后执行 nginx -t 再加载。
# current/site 应指向通过发布校验的 SSG 包；不要指向 CSR dist 或 metadata。
server {
    listen 80;
    server_name www.v7luck.com v7luck.com;
    return 301 https://www.v7luck.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.v7luck.com;
    ssl_certificate /etc/letsencrypt/live/www.v7luck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.v7luck.com/privkey.pem;

    root /srv/workdev-tools/current/site;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 不得用 /index.html 为未知路径兜底 200。
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. { deny all; }
}

# 根域 HTTPS 重定向必须先具备覆盖 v7luck.com 的有效证书；
# 不要假设 www 证书同时覆盖根域。取得证书并获授权后才启用该块。
