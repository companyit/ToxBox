# 放入现有 www.v7luck.com 的 HTTPS server 内。
# 保留 root /home/toxbox/dist;、index、TLS、证书和 server 级 HSTS。
# 删除原 location / 和 location = /index.html，再使用以下片段，避免重复 location。
# 发布目录必须包含生产 SSG 文件，尤其是 404.html 和各路径的 index.html。

error_page 404 /404.html;

location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location / {
    try_files $uri $uri/ =404;
}

# 对首页和 SSG 子页面统一使用原首页的缓存策略。
# 此处定义 add_header 后，显式保留 server 级 HSTS 的效果，兼容现有 Nginx。
location ~ \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
