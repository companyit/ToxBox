<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToxBox Logo 设计稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#172b36;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:48px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:32px}h1{font-size:22px;margin:0}header p{font-size:13px;color:#4d606b;margin:0}.hero{background:#fff;border:1px solid #d4dce1;border-radius:20px;min-height:300px;display:flex;align-items:center;justify-content:center}.hero img{width:360px;max-width:80%;height:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.panel{background:#fff;border:1px solid #d4dce1;border-radius:16px;padding:28px;min-height:180px}.panel.dark{background:#111b22;border-color:#111b22;color:#eef4f6}.label{font-size:12px;letter-spacing:.06em;color:#4d606b;margin:0 0 28px}.dark .label{color:#b6c6cf}.row{display:flex;align-items:center;gap:24px;min-height:64px}.row img{flex-shrink:0}.word{width:240px;max-width:100%}.swatches{display:flex;gap:16px;margin-top:24px}.swatches span{display:flex;align-items:center;gap:8px;font-size:12px;color:#4d606b}.swatches i{width:14px;height:14px;border-radius:4px;background:var(--c)}.note{font-size:13px;line-height:1.7;color:#4d606b;margin-top:24px}.sample{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px}.sample img{width:32px;height:32px}@media(max-width:640px){main{padding:24px}.grid{grid-template-columns:1fr}header{display:block}header p{margin-top:8px}.hero{min-height:220px}}
</style><main><header><h1>ToxBox</h1><p>Logo 设计 · 圆角工具盒 / 负形 T</p></header><section class="hero"><img src="wordmark-primary.svg" alt="ToxBox 绿色横版标志"></section><div class="grid"><section class="panel dark"><p class="label">深色背景</p><img class="word" src="wordmark-dark.svg" alt="深色背景版本"></section><section class="panel"><p class="label">小尺寸识别</p><div class="row"><img src="icon-primary.svg" width="64" height="64" alt="64 像素标志"><img src="icon-primary.svg" width="32" height="32" alt="32 像素标志"><img src="icon-primary.svg" width="16" height="16" alt="16 像素标志"></div></section><section class="panel"><p class="label">单色版本</p><img class="word" src="wordmark-mono.svg" alt="单色标志"></section><section class="panel"><p class="label">网站页头示意</p><div class="sample"><img src="icon-primary.svg" alt="">ToxBox</div></section></div><div class="swatches"><span><i style="--c:#17634f"></i>#17634F</span><span><i style="--c:#2a8469"></i>#2A8469</span><span><i style="--c:#172b36"></i>#172B36</span></div><p class="note">三块几何面围成一个盒子，留白自然形成字母 T。透明背景，支持 SVG 缩放；不使用阴影、渐变或外部字体请求。</p></main></html>
